<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>韦楼超市价格表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 180px;
            background: #1e2a3a;
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
        }
        .sidebar h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #ff6b6b;
            letter-spacing: 2px;
        }
        .sidebar .category-btn {
            background: transparent;
            border: none;
            color: #b0bec5;
            font-size: 1.3rem;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            border-left: 4px solid transparent;
        }
        .sidebar .category-btn:hover,
        .sidebar .category-btn.active {
            background: #2c3e50;
            color: #ff6b6b;
            border-left-color: #ff6b6b;
        }

        .main-content {
            margin-left: 180px;
            flex: 1;
            padding: 20px;
            width: 100%;
        }

        .search-box {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            font-size: 1.6rem;
            padding: 14px 20px;
            border: 2px solid #ddd;
            border-radius: 40px;
            outline: none;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: border 0.3s;
        }
        .search-box input:focus {
            border-color: #ff6b6b;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            padding-bottom: 15px;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f5f5f5;
            border-bottom: 2px solid #eee;
        }
        .product-card .no-img {
            width: 100%;
            height: 200px;
            background: #eceff1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 1.2rem;
        }
        .product-name {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 10px 10px 5px;
            color: #333;
        }
        .product-desc {
            font-size: 1.2rem;
            color: #777;
            margin-bottom: 8px;
        }
        .product-price {
            font-size: 2rem;
            font-weight: bold;
            color: #e63946;
            margin: 5px 0;
        }
        .product-price::before {
            content: '¥';
            font-size: 1.4rem;
        }

        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.8rem;
            color: #999;
            padding: 60px 20px;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                position: static;
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px 5px;
                background: #1e2a3a;
                white-space: nowrap;
            }
            .sidebar h2 { display: none; }
            .sidebar .category-btn {
                display: inline-block;
                padding: 10px 16px;
                font-size: 1.2rem;
                border-left: none;
                border-bottom: 3px solid transparent;
            }
            .sidebar .category-btn.active {
                border-bottom-color: #ff6b6b;
                border-left-color: transparent;
            }
            .main-content {
                margin-left: 0;
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            .product-card img, .product-card .no-img {
                height: 160px;
                object-fit: contain;
            }
            .product-name { font-size: 1.4rem; }
            .product-price { font-size: 1.8rem; }
        }
    </style>

            // 调料
            { category: '调料', name: '酱油', desc: '', price: 5, img: 'jiangyou.jpg' },
        ];

        let currentCategory = 'all';
        let keyword = '';

        const productGrid = document.getElementById('productGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryBtns = document.querySelectorAll('.category-btn');

        function render() {
            let filtered = products;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            if (keyword.trim() !== '') {
                const kw = keyword.trim().toLowerCase();
                filtered = filtered.filter(p => {
                    return p.name.toLowerCase().includes(kw) ||
                           p.desc.toLowerCase().includes(kw) ||
                           p.price.toString() === kw;
                });
            }

            productGrid.innerHTML = '';
            if (filtered.length === 0) {
                productGrid.innerHTML = '<div class="no-result">😕 没找到相关商品</div>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                if (p.img && p.img.trim() !== '') {
                    card.innerHTML = `
                        <img src="${p.img}" alt="${p.name}"  crossorigin="anonymous">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-price">${p.price}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="no-img">暂无图片</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-price">${p.price}</div>
                    `;
                }
                productGrid.appendChild(card);
            });
        }

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                render();
            });
        });

        searchInput.addEventListener('input', (e) => {
            keyword = e.target.value;
            render();
        });

        render();
